# Netlify: static build, hash routing (no redirects needed). Netlify deploys main on every push, so main is protected:
# changes land only through pull requests whose CI checks passed.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Keep equal to .nvmrc (a test checks it).
  NODE_VERSION = "22.23.4"

# Content-hashed files never change under the same name: cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Audio file names hash the voice and the text, so a changed clip gets a new name.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The entry points must always be revalidated, or a new version would never be found.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Icons keep their names: cache for a week.
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    # The microphone is for the parent's recordings, the camera for scanning a pairing QR code; this site only.
    Permissions-Policy = "microphone=(self), camera=(self), geolocation=()"
