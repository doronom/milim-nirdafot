<style>
    body {
      font-family: 'Rubik', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
      line-height: 1;
    }
    /* Countdown Circular Ring Stroke */
    .timer-ring-circle {
      stroke-dasharray: 213;
      stroke-dashoffset: 48;
      transition: stroke-dashoffset 1s linear;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
    }
  </style>

<body class="bg-surface text-on-surface antialiased min-h-screen flex justify-center items-start overflow-x-hidden selection:bg-secondary selection:text-surface-container-lowest">
<!-- Mobile Screen Shell (390px x 844px context) -->
<main class="w-full max-w-[420px] min-h-screen bg-surface flex flex-col justify-between relative shadow-2xl overflow-hidden pb-6">
<!-- Ambient Cosmic Atmosphere Background (Tower of Sages - Navy, Purple, Gold) -->
<div class="absolute inset-0 pointer-events-none opacity-40">
<div class="absolute -top-16 -right-16 w-80 h-80 rounded-full bg-secondary-container blur-3xl opacity-20"></div>
<div class="absolute top-1/3 -left-20 w-80 h-80 rounded-full bg-surface-variant blur-3xl opacity-40"></div>
<div class="absolute bottom-10 right-0 w-72 h-72 rounded-full bg-secondary blur-3xl opacity-15"></div>
<!-- Subtle Starlight Grid Pattern -->
<div class="absolute inset-0 bg-[radial-gradient(#89ceff_1px,transparent_1px)] [background-size:24px_24px] opacity-10"></div>
</div>
<!-- Top Focus Bar (Expedition Header without Shell borders) -->
<header class="relative z-10 px-margin pt-4 pb-2 flex items-center justify-between">
<!-- Right Action: Exit / Pause (Gentle & non-stressful) -->
<button aria-label="השהיית אתגר" class="w-11 h-11 rounded-xl bg-surface-container-high text-on-surface-variant flex items-center justify-center border-b-2 border-outline-variant active:translate-y-0.5 transition-all" type="button">
<span class="material-symbols-outlined text-[22px]">pause</span>
</button>
<!-- Center: Realm Pill & Mode Indicator -->
<div class="flex flex-col items-center">
<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high/90 border border-outline-variant shadow-sm backdrop-blur-md">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-secondary tracking-wide">מגדל המומחים</span>
<span class="text-outline text-label-sm">•</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">אתגר מהירות</span>
</div>
<span class="font-label-sm text-label-sm text-tertiary-fixed-dim mt-0.5 font-semibold">ללא פסילות • כל מילה מזכה!</span>
</div>
<!-- Left Action: Personal Best Mini Tracker -->
<div class="h-11 px-3 rounded-xl bg-surface-container-high/80 border-b-2 border-outline-variant flex items-center gap-1.5 shadow-sm">
<span class="material-symbols-outlined text-secondary text-[20px]" style="font-variation-settings: 'FILL' 1;">hotel_class</span>
<div class="flex flex-col text-left">
<span class="font-label-sm text-[11px] text-outline leading-tight">שיא</span>
<span class="font-headline-sm text-[14px] text-secondary font-bold leading-none">18</span>
</div>
</div>
</header>
<!-- Top Stats Segment: Gold Countdown & Combo Flame -->
<section class="relative z-10 px-margin mt-1">
<div class="grid grid-cols-12 gap-space-md items-center bg-surface-container-low/95 border border-outline-variant/60 rounded-2xl p-space-md shadow-md backdrop-blur-lg">
<!-- 60s Circular Countdown Timer -->
<div class="col-span-5 flex items-center justify-center relative">
<div class="relative w-20 h-20 flex items-center justify-center">
<svg class="w-20 h-20" viewbox="0 0 80 80">
<!-- Background Ring Track -->
<circle class="text-surface-variant" cx="40" cy="40" fill="transparent" r="34" stroke="currentColor" stroke-width="6"></circle>
<!-- Animated Gold Progress Ring -->
<circle class="text-secondary timer-ring-circle" cx="40" cy="40" fill="transparent" r="34" stroke="currentColor" stroke-linecap="round" stroke-width="6"></circle>
</svg>
<div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
<span class="font-headline-md text-headline-md text-secondary font-extrabold tracking-tight">42</span>
<span class="font-label-sm text-[10px] text-on-surface-variant font-medium -mt-1">שניות</span>
</div>
</div>
</div>
<!-- Dynamic Combo & Speed Bonus Card -->
<div class="col-span-7 flex flex-col justify-center pr-1 border-r border-outline-variant/50">
<div class="inline-flex items-center gap-1.5 self-start px-2 py-0.5 rounded-md bg-secondary-container/20 text-secondary border border-secondary/30">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-label-sm text-[12px] font-bold">רצף 5x מושלם!</span>
</div>
<p class="font-label-md text-label-md text-on-surface font-semibold mt-1">

<div class="flex items-center gap-2 mt-1.5 text-on-surface-variant font-label-sm text-[12px]">
<span>שאלות: <strong class="text-primary-fixed-dim font-bold">14/20</strong></span>
<span>•</span>
<span class="text-tertiary-fixed font-bold">+150 נק'</span>
</div>
</div>
</div>
</section>
<!-- Main Challenge Arena: Question Card + Word + 2x2 Tactile Buttons -->
<section class="relative z-10 px-margin my-auto flex flex-col gap-space-md">
<!-- Current Question Target Card -->
<div class="bg-surface-container rounded-2xl p-5 border-b-4 border-outline-variant shadow-lg text-center relative overflow-hidden">
<!-- Explorer Scroll Badge Overlay -->
<div class="absolute top-3 right-3 text-outline/40">
<span class="material-symbols-outlined text-[22px]">explore</span>
</div>
<div class="absolute top-3 left-3 text-secondary/70 flex items-center gap-1">
<span class="font-label-sm text-[11px] font-medium text-outline">ערך מילוני</span>
<span class="font-label-sm text-[11px] font-bold px-1.5 py-0.5 rounded bg-surface-container-high text-primary">b120</span>
</div>
<p class="font-label-md text-label-md text-on-surface-variant mb-1 font-medium">מהי המילה הנרדפת ביותר למילה:</p>

<h1 class="font-display-hero-mobile text-display-hero-mobile text-on-surface font-black tracking-wide my-2 text-primary-fixed">
          מהיר
        </h1>
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high text-on-surface-variant font-body-sm text-[13px]">
<span class="material-symbols-outlined text-[16px] text-tertiary">lightbulb</span>
<span>בחר מילה אחת בעלת משמעות תואמת</span>
</div>
</div>
<!-- Tactile 2x2 Choice Grid -->
<div aria-label="אפשרויות למילה נרדפת" class="grid grid-cols-2 gap-3" role="radiogroup">
<!-- Option 1: CORRECT / SELECTED (Glowing Green State with Tactile Lip) -->
<button class="group relative flex flex-col items-center justify-center p-4 rounded-xl bg-tertiary-container/30 text-tertiary-fixed border-2 border-tertiary border-b-4 border-b-tertiary-container shadow-md active:translate-y-1 active:border-b-2 transition-all cursor-pointer" type="button">
<div class="absolute top-2 right-2 w-5 h-5 rounded-full bg-tertiary text-on-tertiary flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] font-bold" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<span class="font-headline-md text-headline-md font-bold tracking-normal">
            זריז
          </span>
<span class="font-label-sm text-[11px] text-tertiary-fixed-dim mt-0.5 font-medium">נרדפת מדויקת!</span>
</button>
<!-- Option 2: Neutral / Fast candidate -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl bg-surface-container-high text-on-surface border-2 border-outline-variant border-b-4 border-b-surface-dim shadow-sm hover:bg-surface-variant active:translate-y-1 active:border-b-2 transition-all cursor-pointer" type="button">
<span class="font-headline-md text-headline-md font-bold tracking-normal">
            חפוז
          </span>
<span class="font-label-sm text-[11px] text-outline mt-0.5">בחירה אפשרית</span>
</button>
<!-- Option 3: Distractor 1 -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl bg-surface-container-high text-on-surface border-2 border-outline-variant border-b-4 border-b-surface-dim shadow-sm hover:bg-surface-variant active:translate-y-1 active:border-b-2 transition-all cursor-pointer" type="button">
<span class="font-headline-md text-headline-md font-bold tracking-normal">
            איטי
          </span>
<span class="font-label-sm text-[11px] text-outline mt-0.5">היפוכו של דבר</span>
</button>
<!-- Option 4: Distractor 2 -->
<button class="flex flex-col items-center justify-center p-4 rounded-xl bg-surface-container-high text-on-surface border-2 border-outline-variant border-b-4 border-b-surface-dim shadow-sm hover:bg-surface-variant active:translate-y-1 active:border-b-2 transition-all cursor-pointer" type="button">
<span class="font-headline-md text-headline-md font-bold tracking-normal">
            כבד
          </span>
<span class="font-label-sm text-[11px] text-outline mt-0.5">משמעות שונה</span>
</button>
</div>
</section>
<!-- Bottom Action Drawer & Gentle Feedback Trigger -->
<footer class="relative z-10 px-margin pt-2 flex flex-col gap-2.5">
<!-- Primary Tactile Advance Button -->
<button class="w-full min-h-[54px] rounded-xl bg-primary-container text-on-primary-fixed font-headline-sm text-headline-sm font-extrabold flex items-center justify-center gap-2 border-b-4 border-[#0369a1] shadow-lg active:translate-y-1 active:border-b transition-all" type="button">
<span>המשך לשאלה הבאה</span>
<span class="material-symbols-outlined text-[22px]">arrow_back</span>
</button>
<!-- Parent & Kid Inquiry Action ("גם זו תשובה נכונה?") -->
<div class="flex items-center justify-between px-1 text-on-surface-variant">
<button class="inline-flex items-center gap-1.5 font-label-md text-label-md text-outline hover:text-on-surface transition-colors py-1" type="button">
<span class="material-symbols-outlined text-[18px]">help_outline</span>
<span class="underline decoration-dotted decoration-outline">גם זו תשובה נכונה?</span>
</button>
<!-- Current Expedition Score Readout -->
<div class="inline-flex items-center gap-1.5 font-label-md text-label-md font-bold text-secondary">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">military_tech</span>
<span>1,420 נקודות</span>
</div>
</div>
</footer>
